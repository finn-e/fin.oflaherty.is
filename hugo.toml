baseURL = 'https://fin.oflaherty.is'
languageCode = 'en-us'
title = "Fin o'Flaherty | Site Reliability Engineer"
theme = "minimal-black"

# Enable search index generation and web app manifest
[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[params]
  brand = "Fin o'Flaherty"
  description = "Personal portfolio of Fin o'Flaherty, a Site Reliability Engineer III specializing in Kubernetes, GitOps, multi-cloud automation, and low-power systems."

  # Favicon - Place your favicon files in /static/ directory
  # Supported formats: .ico, .png, .svg
  favicon = "icons/favicon.svg"
  appleTouchIcon = "apple-touch-icon.png"

  # Logo (optional)
  logo = "images/logo.png"

  # Project and blog intro text
  projectsIntro = "A curated selection of SRE, cloud infrastructure, and hardware projects."
  blogIntro = "Case studies and write-ups on infrastructure, automation, and debugging complex systems."

  # Web App Manifest Configuration (PWA support)
  [params.manifest]
    themeColor = "#a855f7"
    backgroundColor = "#000000"
    categories = ["blog", "portfolio", "developer"]

  # Theme Configuration
  [params.theme]
    defaultTheme = "dark"  # Options: "light", "dark", "system"

  # Home Page Configuration
  [params.home]
    sections = ["hero", "now", "tech-marquee", "projects", "posts"]
    showNowSection = true
    showFeaturedProjects = true
    showLatestPosts = true
    featuredProjectsLimit = 3
    latestPostsLimit = 3
    projectsTitle = "Selected Work"
    projectsSubtitle = ""
    blogTitle = "Latest Writing"
    blogSubtitle = ""
    techMarqueeLabel = "Experienced In"

    # Technology Stack Display
    [[params.home.tech]]
      label = "Kubernetes"
      icon = "devicon-kubernetes-plain"

    [[params.home.tech]]
      label = "Talos OS"
      icon = "devicon-linux-plain"

    [[params.home.tech]]
      label = "OpenTofu"
      icon = "devicon-terraform-plain"

    [[params.home.tech]]
      label = "Ansible"
      icon = "devicon-ansible-plain"

    [[params.home.tech]]
      label = "AWS"
      icon = "devicon-amazonwebservices-plain"

    [[params.home.tech]]
      label = "Azure"
      icon = "devicon-azure-plain"

    [[params.home.tech]]
      label = "Prometheus"
      icon = "devicon-prometheus-plain"

    [[params.home.tech]]
      label = "Grafana"
      icon = "devicon-grafana-plain"

    [[params.home.techReverse]]
      label = "Rook/Ceph"
      icon = "devicon-linux-plain"

    [[params.home.techReverse]]
      label = "Docker"
      icon = "devicon-docker-plain"

    [[params.home.techReverse]]
      label = "PostgreSQL"
      icon = "devicon-postgresql-plain"

    [[params.home.techReverse]]
      label = "MSSQL"
      icon = "devicon-microsoftsqlserver-plain"

    [[params.home.techReverse]]
      label = "Git"
      icon = "devicon-git-plain"

    [[params.home.techReverse]]
      label = "GitHub Actions"
      icon = "devicon-github-original"

    [[params.home.techReverse]]
      label = "HashiCorp Vault"
      icon = "devicon-vault-plain"

    [[params.home.techReverse]]
      label = "Python"
      icon = "devicon-python-plain"

    [[params.home.techReverse]]
      label = "PowerShell"
      icon = "devicon-powershell-plain"

    [[params.home.techReverse]]
      label = "Linux"
      icon = "devicon-linux-plain"

  # About Page Alternative Layout Configuration - Optional
  [params.about.alt]
    # Stats displayed in the profile card sidebar
    [[params.about.alt.stats]]
      value = "10+"
      label = "Years Experience"

    [[params.about.alt.stats]]
      value = "20+"
      label = "Projects"

    [[params.about.alt.stats]]
      value = "99.99%"
      label = "Uptime Target"

    # Skills/Tech Stack badges with icons
    [[params.about.alt.skills]]
      label = "Kubernetes"
      icon = "devicon-kubernetes-plain"

    [[params.about.alt.skills]]
      label = "Talos OS"
      icon = "devicon-linux-plain"

    [[params.about.alt.skills]]
      label = "OpenTofu"
      icon = "devicon-terraform-plain"

    [[params.about.alt.skills]]
      label = "Ansible"
      icon = "devicon-ansible-plain"

    [[params.about.alt.skills]]
      label = "AWS"
      icon = "devicon-amazonwebservices-plain"

    [[params.about.alt.skills]]
      label = "Azure"
      icon = "devicon-azure-plain"

    [[params.about.alt.skills]]
      label = "Prometheus"
      icon = "devicon-prometheus-plain"

    [[params.about.alt.skills]]
      label = "Python"
      icon = "devicon-python-plain"

  # Hero Section Configuration
  [params.hero]
    badge = "Site Reliability Engineer III"
    title = "Hi, I'm Fin o'Flaherty."
    role = "Designing, automating, and scaling high-availability systems"
    summary = "Site Reliability Engineer with a decade of experience designing and automating cloud-native, containerized, and bare-metal infrastructure. Expert in AWS, Azure, Talos OS, GitOps workflows, and system optimization."
    # avatar = "images/avatar.jpg"  # Optional: 400x400px recommended
    location = "Kentucky, USA"
    focus = "Focused on GitOps, Kubernetes platforms, and custom automation tooling."
    available = true
    availableLabel = "Available for work / Open to relocation"

    nowLabel = "Quick Facts"
    nowIntro = "Right now I'm mainly:"
    now = [
      "Deploying multi-cloud production systems across AWS & Azure",
      "Automating bare-metal Kubernetes clusters using Talos OS and OpenTofu",
      "Optimizing persistent volume storage with Rook/Ceph grids",
      "Designing custom ergonomic mechanical keyboards and firmware"
    ]

    [params.hero.primary]
      label = "View Projects"
      href = "/projects/"

    [params.hero.secondary]
      label = "Read the Blog"
      href = "/blog/"

  # Icon Libraries
  [params.icons]
    useFontAwesome = true
    useDevicon = true

  # Social Links
  [[params.social]]
    label = "GitHub"
    url = "https://github.com/finn-e"
    icon = "fa-brands fa-github"

  [[params.social]]
    label = "LinkedIn"
    url = "https://www.linkedin.com/in/oflah3rty"
    icon = "fa-brands fa-linkedin-in"

  [[params.social]]
    label = "Email"
    url = "mailto:fin@oflaherty.is"
    icon = "fa-regular fa-envelope"

  # Analytics Configuration
  [params.analytics]
    # Google Analytics (GA4)
    # googleAnalytics = "G-XXXXXXXXXX"

    # Plausible Analytics (privacy-friendly)
    # [params.analytics.plausible]
    #   enabled = true
    #   domain = "yourdomain.com"
    #   scriptUrl = "https://plausible.io/js/script.js"

    # Umami Analytics (self-hosted option)
    # [params.analytics.umami]
    #   enabled = true
    #   scriptUrl = "https://analytics.yourdomain.com/script.js"
    #   websiteId = "your-website-id"

    # Fathom Analytics
    # [params.analytics.fathom]
    #   enabled = true
    #   scriptUrl = "https://cdn.usefathom.com/script.js"
    #   siteId = "YOUR-SITE-ID"

# Navigation Menu
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    url = "/"
    weight = 1
    identifier = "home"
    [menu.main.params]
      icon = "fa-solid fa-house"

  [[menu.main]]
    name = "About"
    pageRef = "about"
    url = "/about/"
    weight = 2
    identifier = "about"
    [menu.main.params]
      icon = "fa-regular fa-user"

  [[menu.main]]
    name = "About Alt"
    pageRef = "about-alternative"
    url = "/about-alternative/"
    weight = 2
    identifier = "about-alternative"
    [menu.main.params]
      icon = "fa-solid fa-user"

  [[menu.main]]
    name = "Projects"
    pageRef = "projects"
    url = "/projects/"
    weight = 3
    identifier = "projects"
    [menu.main.params]
      icon = "fa-regular fa-folder-open"

  [[menu.main]]
    name = "Blog"
    pageRef = "blog"
    url = "/blog/"
    weight = 4
    identifier = "blog"
    [menu.main.params]
      icon = "fa-regular fa-note-sticky"

# Markup Configuration
[markup]
  # Table of Contents
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  # Goldmark Renderer (Markdown)
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

  [markup.goldmark.extensions]
    typographer = true
    linkify = true
    table = true
    strikethrough = true
    taskList = true
    definitionList = true
    footnote = true

    [markup.goldmark.extensions.extras.delete]
      enable = true
    [markup.goldmark.extensions.extras.insert]
      enable = true
    [markup.goldmark.extensions.extras.mark]
      enable = true

  # Syntax Highlighting
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "monokai"
    tabWidth = 2

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Privacy Configuration
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
